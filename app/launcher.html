:root{--bg:#05070e;--fg:#f4f6fb;--fg-dim:rgba(244,246,251,.62);--glass:rgba(255,255,255,.09);--glass-strong:rgba(255,255,255,.17);--glass-edge:rgba(255,255,255,.28);--focus:rgba(255,255,255,.95)}
html,body{width:100%;height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Figtree","Samsung One",sans-serif;overflow:hidden;cursor:none}
*{box-sizing:border-box}
.stage{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;background:var(--bg)}
.wall{position:absolute;top:-5%;left:-5%;right:-5%;bottom:-5%;background-size:cover;background-position:center;opacity:0;transition:opacity 2.5s ease,filter .5s ease;will-change:transform,opacity}
.wall.on{opacity:1}
.wall.kb1{animation:kb1 50s linear forwards}.wall.kb2{animation:kb2 50s linear forwards}.wall.kb3{animation:kb3 50s linear forwards}.wall.kb4{animation:kb4 50s linear forwards}
@keyframes kb1{from{transform:scale(1.02) translate(-2.5%,1.5%)}to{transform:scale(1.14) translate(2.5%,-1.5%)}}
@keyframes kb2{from{transform:scale(1.14) translate(2.5%,1.5%)}to{transform:scale(1.02) translate(-2.5%,-1.5%)}}
@keyframes kb3{from{transform:scale(1.05) translate(2.5%,-1.5%)}to{transform:scale(1.16) translate(-2.5%,1.5%)}}
@keyframes kb4{from{transform:scale(1.16) translate(-2.5%,-1.5%)}to{transform:scale(1.04) translate(2.5%,1.5%)}}
.stage.dim .wall{filter:blur(12px) brightness(.55)}
.hdr,.wx,.dock,.hint,.credit{transition:opacity .3s ease}
.stage.dim .hdr,.stage.dim .wx,.stage.dim .dock,.stage.dim .hint,.stage.dim .credit{opacity:0}
.tint{position:absolute;top:0;left:0;right:0;bottom:0;opacity:0;transition:opacity .9s ease;pointer-events:none}
.tint.on{opacity:1}
.vignette{position:absolute;top:0;left:0;right:0;bottom:0;background:
  radial-gradient(ellipse 120% 90% at 50% 45%,transparent 50%,rgba(3,5,12,.5) 100%),
  linear-gradient(to bottom,rgba(3,5,12,.25),transparent 25%,transparent 52%,rgba(3,5,12,.8))}
.credit{position:absolute;left:3vw;bottom:1.6vh;font-size:.75vw;color:rgba(244,246,251,.35);letter-spacing:.08em;text-transform:uppercase}
/* orologio a sinistra */
.hdr{position:absolute;left:5vw;top:6vh;text-shadow:0 2px 24px rgba(0,0,0,.6)}
.hdr .greet{font-size:1.7vw;color:rgba(244,246,251,.8);font-weight:500;margin-bottom:.2vw}
.hdr .clock{font-size:7.4vw;font-weight:700;line-height:1;letter-spacing:-.04em}
.hdr .date{font-size:1.8vw;color:rgba(244,246,251,.8);margin-top:.6vw;text-transform:capitalize}
/* meteo in colonna a destra */
.wx{position:absolute;right:5vw;top:6vh;width:19vw;padding:1.2vw 1.4vw;border-radius:1.6vw;background:var(--glass);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 var(--glass-edge),0 20px 50px rgba(0,0,0,.35);text-align:right}
.wx .now{display:flex;align-items:center;justify-content:flex-end}
.wx .now svg{width:3.6vw;height:3.6vw;margin-right:.8vw;flex:none}
.wx .t{font-size:3.6vw;font-weight:700;line-height:1;letter-spacing:-.03em}
.wx .t sup{font-size:.4em;font-weight:500;vertical-align:top;margin-left:.1em}
.wx .d{font-size:1.05vw;color:rgba(244,246,251,.78);margin-top:.5vw;line-height:1.35}
.wx .d b{display:block;color:var(--fg);font-weight:600;font-size:1.1vw}
.wx .days{margin-top:.9vw;border-top:1px solid rgba(255,255,255,.14);padding-top:.7vw}
.wx .day{display:flex;align-items:center;justify-content:flex-end;font-size:1.05vw;margin-top:.35vw}
.wx .day .n{width:3.2vw;text-align:left;color:rgba(244,246,251,.75)}
.wx .day svg{width:1.7vw;height:1.7vw;margin:0 .8vw}

  box-shadow:0 14px 34px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}

  box-shadow:inset 0 1px 0 var(--glass-edge),0 10px 30px rgba(0,0,0,.3);transition:transform .2s,background .2s,box-shadow .2s}

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var VERSION='2.0.0';
  var isTV=location.protocol!=='file:'&&location.hostname==='127.0.0.1'; // caricato da TizenBrew
  var REPO='apiazza75/samsung-tizen-home';
  var CDN=window.MH_CDN||'https://cdn.jsdelivr.net/gh/'+REPO+'@', API=window.MH_API||'https://api.github.com/repos/'+REPO+'/commits/main';
  var ICONS=window.MH_ICONS||{};
  var toastEl=$('toast'),tt;
  function toast(m,ms){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('show')},ms||1800);}
  function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

  /* ---------- orologio (allineato al minuto) ---------- */
  var months=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  var days=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'],dShort=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
  function greeting(h){return h<5?'Buonanotte':h<12?'Buongiorno':h<18?'Buon pomeriggio':'Buonasera';}
  var tickT=null,wxLine='';
  function tick(){clearTimeout(tickT);var d=new Date(),hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2),ds=days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()];
    $('clock').textContent=hm;$('date').textContent=ds;$('greet').textContent=greeting(d.getHours());$('aclock').textContent=hm;$('adate').textContent=ds+(wxLine?' · '+wxLine:'');
    tickT=setTimeout(tick,60000-(d.getSeconds()*1000+d.getMilliseconds())+50);}
  tick();

  /* ---------- sfondi: dal commit in uso (jsDelivr), altrimenti dalla cache su disco del servizio; deriva lenta e dissolvenza ---------- */
  var SVC='http://127.0.0.1:8095',svcOk=false,dbg={};
  var WALLS=[['wall1.jpg','Duomo e Castello dall\'alto · Gianluca, Pexels'],['wall2.jpg','Castello Sforzesco · Mikhail Nilov, Pexels'],
             ['wall3.jpg','Guglie del Duomo all\'ora blu · A. Buchinskaia, Unsplash'],['wall4.jpg','Duomo al tramonto · Mahya Jahangir, Unsplash']];
  var A=$('wallA'),B=$('wallB'),front=A,wi=0,kbs=['kb1','kb2','kb3','kb4'],kbi=0,wallSrc={};
  function wallUrl(i,fallback){return fallback?SVC+'/asset?name='+WALLS[i][0]:WALLS[i][0];}
  function loadWall(i,cb){if(wallSrc[i])return cb(wallSrc[i]);var img=new Image(),second=false;
    img.onload=function(){wallSrc[i]=img.src;cb(img.src)};img.onerror=function(){if(second)return cb(null);second=true;img.src=wallUrl(i,true)};img.src=wallUrl(i,false);}
  function showWall(i){loadWall(i,function(src){if(!src){dbg.wallErr=WALLS[i][0];return;}var next=front===A?B:A;next.style.backgroundImage='url("'+src+'")';next.className='wall on '+kbs[kbi++%4];front.className='wall';front=next;$('credit').textContent='Foto: '+WALLS[i][1];});}
  showWall(0);setInterval(function(){wi=(wi+1)%WALLS.length;showWall(wi);},75000);
  /* tinta dello sfondo con il colore dell'app selezionata (due strati in dissolvenza) */
  var TA=$('tintA'),TB=$('tintB'),tintFront=TA,lastTint=null;
  function hexToRgba(h,a){var m=/^#?([0-9a-f]{6})$/i.exec(h||'');if(!m)return null;var n=parseInt(m[1],16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
  function setTint(hex){if(hex===lastTint)return;lastTint=hex;var c=hexToRgba(hex,.62),c2=hexToRgba(hex,.26);if(!c){TA.className='tint';TB.className='tint';return;}
    var next=tintFront===TA?TB:TA;next.style.background='radial-gradient(ellipse 60% 55% at 50% 105%,'+c+',transparent 70%),linear-gradient(to top,'+c2+',transparent 45%)';next.className='tint on';tintFront.className='tint';tintFront=next;}

  /* ---------- meteo: Open-Meteo, Berbenno di Valtellina ---------- */
  var WICON={
    sun:'<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="12" fill="#ffd36a"/><g stroke="#ffd36a" stroke-width="4" stroke-linecap="round"><path d="M32 6v8M32 50v8M6 32h8M50 32h8M13.6 13.6l5.7 5.7M44.7 44.7l5.7 5.7M13.6 50.4l5.7-5.7M44.7 19.3l5.7-5.7"/></g></svg>',
    partly:'<svg viewBox="0 0 64 64" fill="none"><circle cx="24" cy="24" r="10" fill="#ffd36a"/><path d="M20 50h26a9 9 0 0 0 1-18 13 13 0 0 0-25 3 7.5 7.5 0 0 0-2 15z" fill="#eef3ff"/></svg>',
    cloud:'<svg viewBox="0 0 64 64" fill="none"><path d="M18 50h28a10 10 0 0 0 1-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-2 17z" fill="#dfe6f5"/></svg>',
    fog:'<svg viewBox="0 0 64 64" fill="none"><g stroke="#dfe6f5" stroke-width="4" stroke-linecap="round"><path d="M12 24h40M8 34h48M14 44h36"/></g></svg>',
    rain:'<svg viewBox="0 0 64 64" fill="none"><path d="M18 42h28a10 10 0 0 0 1-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-2 17z" fill="#dfe6f5"/><g stroke="#7fb8ff" stroke-width="4" stroke-linecap="round"><path d="M24 48l-3 8M34 48l-3 8M44 48l-3 8"/></g></svg>',
    snow:'<svg viewBox="0 0 64 64" fill="none"><path d="M18 42h28a10 10 0 0 0 1-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-2 17z" fill="#dfe6f5"/><g fill="#fff"><circle cx="23" cy="52" r="3"/><circle cx="33" cy="56" r="3"/><circle cx="43" cy="52" r="3"/></g></svg>',
    storm:'<svg viewBox="0 0 64 64" fill="none"><path d="M18 40h28a10 10 0 0 0 1-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-2 17z" fill="#c9d3ea"/><path d="M34 40l-8 12h8l-4 10 12-14h-8l4-8z" fill="#ffd36a"/></svg>'
  };
  function wmo(c){if(c===0)return['sun','Sereno'];if(c<=2)return['partly','Poco nuvoloso'];if(c===3)return['cloud','Nuvoloso'];if(c<=48)return['fog','Nebbia'];
    if(c<=67)return['rain','Pioggia'];if(c<=77)return['snow','Neve'];if(c<=82)return['rain','Rovesci'];if(c<=86)return['snow','Neve'];return['storm','Temporale'];}
  function renderWeather(j){var cur=j.current,dl=j.daily,w=wmo(cur.weather_code),h='';
    h+='<div class="now">'+WICON[w[0]]+'<div class="t">'+Math.round(cur.temperature_2m)+'<sup>°C</sup></div></div>';
    h+='<div class="d"><b>Berbenno di Valtellina</b>'+w[1]+' · max '+Math.round(dl.temperature_2m_max[0])+'° · min '+Math.round(dl.temperature_2m_min[0])+'°</div><div class="days">';
    for(var i=1;i<=3&&i<dl.time.length;i++){var d=new Date(dl.time[i]+'T12:00:00'),ww=wmo(dl.weather_code[i]);
      h+='<div class="day"><span class="n">'+dShort[d.getDay()]+'</span>'+WICON[ww[0]]+'<span class="hi">'+Math.round(dl.temperature_2m_max[i])+'°</span><span class="lo">'+Math.round(dl.temperature_2m_min[i])+'°</span></div>';}
    h+='</div><div class="src">Open-Meteo · '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+'</div>';
    $('weather').innerHTML=h;wxLine=Math.round(cur.temperature_2m)+'° '+w[1].toLowerCase();tick();}
  function loadWeather(){var url='https://api.open-meteo.com/v1/forecast?latitude=46.165&longitude=9.745&daily=weather_code,temperature_2m_max,temperature_2m_min&current=temperature_2m,weather_code&timezone=Europe%2FRome&forecast_days=4';
    fetch(url).then(function(r){return r.json()}).then(function(j){renderWeather(j);try{localStorage.setItem('mh_wx',JSON.stringify(j))}catch(e){}})
    .catch(function(){try{var c=localStorage.getItem('mh_wx');if(c)renderWeather(JSON.parse(c));else $('weather').innerHTML='<div class="now"><div class="d"><b>Meteo</b>non disponibile</div></div>';}catch(e){}});}
  loadWeather();setInterval(loadWeather,3600000);

  /* ---------- app: catalogo, icone nostre, categorie ---------- */
  var PREFERRED=['netflix','prime video','disney+','dazn','spotify','raiplay','mediaset infinity','now','sky go','apple tv','plex','paramount+','twitch','internet','samsung tv plus','timvision'];
  var HIDE=['smart hub','gallery','universal guide','e-manual','ambient','samsungtv','samsung health','bixby','multi view','camera','privacy','pc on tv','workspace','remote access','tv plus free','art mode','samsung promotion'];
  var SELF='samsung-tizen-home';
  var MODULE_SUB={'tizentube':'TizenTube · senza pubblicità','jellyfin':'film e serie dal PC','moonlight':'giochi in streaming dal PC'};
  var HDMI_NAMES=['HDMI','Decoder','Console','PlayStation','Xbox','PC','Apple TV','Fire TV','Lettore Blu-ray','Soundbar'];
  var CAT={streaming:'Streaming',media:'Media e musica',games:'Giochi',sorgenti:'Sorgenti',tv:'TV e sistema',altre:'Altre app'};
  var CAT_ORDER=['streaming','media','games','sorgenti','tv','altre'];
  var KEY_CAT={netflix:'streaming',primevideo:'streaming',disneyplus:'streaming',dazn:'streaming',raiplay:'streaming',timvision:'streaming',infinity:'streaming',now:'streaming',skygo:'streaming',
    paramountplus:'streaming',discoveryplus:'streaming',rakutentv:'streaming',plutotv:'streaming',chili:'streaming',crunchyroll:'streaming',hbomax:'streaming',tvplus:'streaming',appletv:'streaming',tim:'streaming',
    youtube:'media',jellyfin:'media',plex:'media',kodi:'media',emby:'media',infuse:'media',vlc:'media',spotify:'media',applemusic:'media',amazonmusic:'media',tidal:'media',deezer:'media',twitch:'media',internet:'media',airplay:'media',smartthings:'media',
    xbox:'games',moonlight:'games',steamlink:'games',geforcenow:'games',hdmi:'sorgenti',tizenbrew:'tv',settings:'tv',home:'tv',power:'tv',apps:'tv'};
  var HUES=[["#4f7cff","#1b2f73"],["#ff6b4a","#7a2415"],["#2fbf8f","#0f4f3a"],["#b26bff","#3d1f73"],["#ffb547","#7a4a0f"],["#3cc4e8","#0f4a5c"]];
  function hueFor(name){var h=0;for(var i=0;i<name.length;i++)h=(h*31+name.charCodeAt(i))>>>0;return HUES[h%HUES.length];}
  var iconKeys=Object.keys(ICONS);
  function iconKeyFor(name,id){var n=String(name||'').toLowerCase().trim(),idl=String(id||'').toLowerCase(),k,i,ic;if(!n&&!idl)return null;
    for(i=0;i<iconKeys.length;i++){k=iconKeys[i];ic=ICONS[k];if(n&&ic.names&&ic.names.indexOf(n)>=0)return k;}
    for(i=0;i<iconKeys.length;i++){k=iconKeys[i];ic=ICONS[k];if(idl&&ic.ids&&ic.ids.length&&ic.ids.some(function(s){return s&&idl.indexOf(String(s).toLowerCase())>=0}))return k;}
    for(i=0;i<iconKeys.length;i++){k=iconKeys[i];ic=ICONS[k];if(n&&ic.names&&ic.names.some(function(nm){return nm.length>3&&n.indexOf(nm)===0}))return k;}
    return null;}
  var items=[],tiles=[],cur=0,modules=[],allApps=[],catalog=[],lastApps=[],lastMods=[],demoMode=false;
  var rowEl=$('row');

  /* preferenze (ordine, nascoste, nomi HDMI, ultima app) e cache del catalogo, salvate sulla TV */
  var prefs={order:[],hidden:[],hdmi:{},last:null,back:true,lastAt:{}};
  try{var pp=localStorage.getItem('mh_prefs');if(pp){var o=JSON.parse(pp);for(var k in o)if(o[k]!==null&&o[k]!==undefined)prefs[k]=o[k];}}catch(e){}
  if(!prefs.lastAt||typeof prefs.lastAt!=='object')prefs.lastAt={};
  function savePrefs(){try{localStorage.setItem('mh_prefs',JSON.stringify(prefs))}catch(e){}}
  function hdmiName(n){return prefs.hdmi[n]||'HDMI '+n;}
  function agoText(t){if(!t)return '';var m=Math.round((Date.now()-t)/60000);if(m<1)return 'adesso';if(m<60)return m+' min fa';var h=Math.round(m/60);if(h<24)return h+' h fa';var d=Math.round(h/24);return d===1?'ieri':d+' giorni fa';}

  /* --- servizio locale (service-core.js) --- */

    showPanel('inner menu');}
  function retryHub(){ensureService().then(function(ok){if(!ok)return noService();toast('Riprovo il collegamento con la TV…',3000);
    fetchJson(SVC+'/hubreset',45000).then(function(r){if(r.error)toast('Smart Hub non disponibile: '+r.error,6000);else toast('Smart Hub: '+r.apps+' app',3000);
      ping().then(function(){loadApps().then(function(a){if(a&&a.length)rebuild(lastMods,a);});});}).catch(function(){toast('Nessuna risposta dal servizio',4000)});});}
  function openPicker(all){mode='pick';pickAll=!!all;psel=0;vis={};$('ptitle').textContent=all?'Tutte le app di sistema':'Scegli e ordina le app della riga';$('pdesc').textContent='Invio = mostra/nascondi nella riga · ← → (o canale ▲▼) = sposta su/giù · Indietro = salva e chiudi';
    pick=applyPrefs().filter(function(c){return pickAll||!c.sys||isVisible(c);});showPanel('inner');}
  function openHdmi(){mode='hdmi';psel=0;$('ptitle').textContent='Nomi degli ingressi HDMI';$('pdesc').textContent='← → cambia nome · Indietro = salva e chiudi';showPanel('inner menu');}
  function isVisibleRaw(c){return vis[c.id]!==undefined?vis[c.id]:isVisible(c);}
  function rowsOf(){return mode==='menu'?prows:mode==='hdmi'?[1,2,3,4]:pick;}
  function drawRows(){plist.innerHTML='';var rows=rowsOf();
    var rowH=(mode==='pick'?2.6:3.3)*window.innerWidth/100,listH=plist.clientHeight||rowH*10,N=Math.max(3,Math.floor(listH/rowH)),start=Math.max(0,Math.min(psel-Math.floor(N/2),rows.length-N));
    rows.slice(start,start+N).forEach(function(r,k){var i=start+k;var d=document.createElement('div');d.className='item'+(i===psel?' sel':'');
      if(mode==='menu'){d.textContent=r.t;}
      else if(mode==='hdmi'){d.innerHTML='<span class="nm"></span><span class="id"></span>';d.querySelector('.nm').textContent='HDMI '+r+'  →  '+hdmiName(r);d.querySelector('.id').textContent='← →';}
      else{var on=isVisibleRaw(r);d.className+=(on?' on':' hid');d.innerHTML='<span class="ck">'+(on?'✓':'')+'</span><span class="nm"></span><span class="id"></span><span class="mv">◀ su · ▶ giù</span>';d.querySelector('.nm').textContent=r.name+(r.dup?' (duplicato)':(r.sys&&pickAll)?' (sistema)':'');d.querySelector('.id').textContent=(pickAll&&r.kind==='app')?r.id:'';}
      plist.appendChild(d);});
    if(rows.length>N){var pos=document.createElement('div');pos.className='pos';pos.textContent=(psel+1)+' / '+rows.length;plist.appendChild(pos);}
    if(!rows.length){var e=document.createElement('div');e.className='item';e.textContent='Nessuna voce';plist.appendChild(e);}}
  // salva solo le voci toccabili dalla lista corrente; conserva ordine/nascoste delle voci non in lista
  function commitOrder(){if(!pick.length)return;var ids=pick.map(function(c){return c.id});
    var keepO=prefs.order.filter(function(id){return ids.indexOf(id)<0}),keepH=prefs.hidden.filter(function(id){return ids.indexOf(id)<0});
    var order=[],hidden=[];pick.forEach(function(c){var on=isVisibleRaw(c);if(on||c.def||prefs.order.indexOf(c.id)>=0){order.push(c.id);if(!on)hidden.push(c.id);}});
    prefs.order=order.concat(keepO);prefs.hidden=hidden.concat(keepH);savePrefs();applyPrefs();render();buildGrid();}
  function closePanel(){if(mode==='pick')commitOrder();
    if(mode==='hdmi'){savePrefs();catalog.forEach(function(c){if(c.kind==='hdmi'){c.name=hdmiName(c.n);c.sub=prefs.hdmi[c.n]?'HDMI '+c.n:'cambia sorgente';}});applyPrefs();render();buildGrid();}
    panel.classList.remove('show');mode=null;vis={};}
  function panelKey(k){var rows=rowsOf();
    if(k===10009||k===27||k===8){closePanel();return;}
    if(!rows.length)return;
    if(k===40){psel=(psel+1)%rows.length;drawRows();}else if(k===38){psel=(psel-1+rows.length)%rows.length;drawRows();}
    else if(k===13){if(mode==='menu')rows[psel].a();else if(mode==='pick'){var c=pick[psel];vis[c.id]=!isVisibleRaw(c);drawRows();}}
    else if((k===37||k===39||k===427||k===428)&&mode==='pick'){var j=(k===37||k===427)?psel-1:psel+1;if(j<0||j>=pick.length)return;var tmp=pick[psel];pick[psel]=pick[j];pick[j]=tmp;psel=j;drawRows();}
    else if((k===37||k===39)&&mode==='hdmi'){var n=rows[psel],idx=HDMI_NAMES.indexOf(prefs.hdmi[n]||'HDMI');idx=(idx+(k===39?1:-1)+HDMI_NAMES.length)%HDMI_NAMES.length;
      if(HDMI_NAMES[idx]==='HDMI')delete prefs.hdmi[n];else prefs.hdmi[n]=HDMI_NAMES[idx];drawRows();}}
  function toggleDebug(){var d=$('debug');if(d.classList.contains('show')){d.classList.remove('show');return;}
    d.textContent='MILANO HOME '+VERSION+' · diagnostica · leggo lo stato del servizio…';d.classList.add('show');
    ping().then(function(){if(d.classList.contains('show'))drawDebug();});}
  function drawDebug(){var d=$('debug');var s=dbg.svc||{},hub=s.hub||{},lc=readLauncherCache();
    var lines=['MILANO HOME '+VERSION+' · commit '+(window.MH_REF?String(window.MH_REF).slice(0,7):'locale')+' da '+(window.MH_SOURCE||'file')+' · diagnostica  (↑ ↓ scorri · Indietro chiude)',
      'aggiornamento: '+upd.state+(upd.svc?' · servizio: '+upd.svc:'')+' · cache launcher: '+(lc?lc.ref.slice(0,7):'assente'),
      'servizio: '+(svcOk?'ok v'+s.v+' commit '+(s.ref?String(s.ref).slice(0,7):'?')+' node '+s.node+(s.boot?' · avviato da '+s.boot.source+(s.boot.lastError?' · '+s.boot.lastError:''):' · bootstrap 1.x'):'assente')+'  ·  moduli: '+(dbg.modsOk?modules.map(function(m){return m.name}).join(', '):'non ricevuti')+'  ·  app: '+allApps.length+(dbg.appsErr?'  ·  errore: '+dbg.appsErr:'')+'  ·  in cache: '+(cached&&cached.apps?cached.apps.length:0),
      'Smart Hub: '+(dbg.hub!==undefined&&dbg.hub!==null?dbg.hub+' app dal canale':'canale non disponibile')+(dbg.hubErr?' ('+dbg.hubErr+')':'')+' · cartella icone: '+(hub.dir!==undefined&&hub.dir!==null?hub.dir+' app':'non leggibile'+(hub.dirError?' ('+hub.dirError+')':''))+' · abbinate: '+allApps.filter(function(a){return a.hub}).length+' · IP TV: '+(s.lan||'?')+(hub.chan?' · canale ok su '+hub.chan.host+(hub.chan.tls?':8002':':8001'):''),
      'tentativi canale: '+((hub.attempts||[]).map(function(a){return a.host+':'+a.port+' → '+a.result+(a.events&&a.events.length?' ['+a.events.join(', ')+']':'');}).join('  |  ')||'nessuno')+(dbg.wallErr?' · sfondo non caricato: '+dbg.wallErr:'')];
    allApps.forEach(function(a){lines.push((a.show===false?'[nascosta] ':'')+(a.hub?'[hub '+a.hub+'] ':'')+(a.iconOk===true?'[icona] ':a.iconOk===false?'[icona assente] ':'')+(iconKeyFor(a.name,a.id)?'[nostra] ':'')+a.name+'  ·  '+a.id);});
    d.textContent=lines.join('\n');d.scrollTop=0;}

  /* ---------- telecomando ---------- */
  var hintT=setTimeout(function(){$('hint').classList.add('fade')},12000);
  document.addEventListener('keydown',function(e){var k=e.keyCode;
    $('hint').classList.remove('fade');clearTimeout(hintT);hintT=setTimeout(function(){$('hint').classList.add('fade')},12000);
    var dd=$('debug');if(dd.classList.contains('show')){if(k===10009||k===27||k===8||k===13)dd.classList.remove('show');else if(k===40)dd.scrollTop+=dd.clientHeight*0.8;else if(k===38)dd.scrollTop-=dd.clientHeight*0.8;e.preventDefault();return;}
    if(mode){panelKey(k);e.preventDefault();return;}
    if(gridOpen){gridKey(k);e.preventDefault();return;}
    if(k===39){focus(cur+1);e.preventDefault();}else if(k===37){focus(cur-1);e.preventDefault();}
    else if(k===13){launch();e.preventDefault();}
    else if(k===38){openMenu();e.preventDefault();}
    else if(k===40){openGrid();e.preventDefault();}
    else if(k===10009||k===27){e.preventDefault();if(history.length>1)history.back();}
    else if(k===427){focus(cur-5);e.preventDefault();}else if(k===428){focus(cur+5);e.preventDefault();}
  });
  window.addEventListener('resize',function(){focus(cur);if(gridOpen)gfocus();});
  document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();loadWeather();}});
})();
</script>

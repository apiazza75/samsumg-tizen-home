<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Milano Home</title>
<style>
/* Milano Home — launcher per Samsung Tizen (modulo TizenBrew). CSS compatibile con Chromium 76 (Tizen 6): niente gap, clamp, inset, aspect-ratio. */
@font-face{font-family:"Figtree";font-weight:400 700;font-style:normal;src:url(figtree.woff2) format("woff2")}
:root{--bg:#05070e;--fg:#f4f6fb;--fg-dim:rgba(244,246,251,.62);--glass:rgba(255,255,255,.09);--glass-strong:rgba(255,255,255,.17);--glass-edge:rgba(255,255,255,.28);--focus:rgba(255,255,255,.95)}
html,body{width:100%;height:100%;margin:0;background:var(--bg);color:var(--fg);font-family:"Figtree","Samsung One",sans-serif;overflow:hidden;cursor:none}
*{box-sizing:border-box}
.stage{position:fixed;top:0;left:0;right:0;bottom:0;overflow:hidden;background:var(--bg)}
.wall{position:absolute;top:-4%;left:-4%;right:-4%;bottom:-4%;background-size:cover;background-position:center;opacity:0;transition:opacity 2.5s ease}
.wall.on{opacity:1}
.wall.kb1{animation:kb1 70s linear forwards}.wall.kb2{animation:kb2 70s linear forwards}
@keyframes kb1{from{transform:scale(1.02) translate(-1%,.5%)}to{transform:scale(1.10) translate(1%,-.8%)}}
@keyframes kb2{from{transform:scale(1.10) translate(1%,.6%)}to{transform:scale(1.02) translate(-1%,-.5%)}}
.vignette{position:absolute;top:0;left:0;right:0;bottom:0;background:
  radial-gradient(ellipse 120% 90% at 50% 45%,transparent 50%,rgba(3,5,12,.5) 100%),
  linear-gradient(to bottom,rgba(3,5,12,.2),transparent 25%,transparent 55%,rgba(3,5,12,.75))}

.ui{position:fixed;top:0;left:0;right:0;bottom:0;padding:4vh 5vw 4vh 5vw}
.top{position:absolute;top:4vh;left:5vw;right:5vw;height:22vh}
.clock{font-size:8.5vw;font-weight:600;line-height:.95;letter-spacing:-.03em;font-variant-numeric:tabular-nums;text-shadow:0 2px 30px rgba(0,0,0,.6)}
.date{font-size:1.6vw;font-weight:500;color:var(--fg-dim);margin-top:.6vw;text-transform:capitalize}

.card{position:absolute;top:0;right:0;background:var(--glass);border:1px solid var(--glass-edge);border-radius:1.8vw;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -1px 0 rgba(255,255,255,.06),0 24px 50px rgba(0,0,0,.45);overflow:hidden}
.card:before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(120deg,rgba(255,255,255,.2) 0%,rgba(255,255,255,.05) 30%,transparent 55%,rgba(255,255,255,.07) 100%)}
.weather{padding:1.2vw 1.5vw 1vw;white-space:nowrap}
.weather .row{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center}
.now{display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;margin-right:1.4vw}
.now svg{width:4.2vw;height:4.2vw;margin-right:.6vw}
.now .t{font-size:3.6vw;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums;margin-right:.6vw}
.now .t sup{font-size:.45em;font-weight:500;vertical-align:.8em;color:var(--fg-dim)}
.now .d{font-size:.95vw;color:var(--fg-dim);font-weight:500;line-height:1.25}
.now .d b{display:block;color:var(--fg);font-weight:600;font-size:1.1em}
.days{display:-webkit-flex;display:flex;padding-left:1.4vw;border-left:1px solid rgba(255,255,255,.18)}
.day{display:-webkit-flex;display:flex;-webkit-flex-direction:column;flex-direction:column;-webkit-align-items:center;align-items:center;min-width:3.4vw;margin-right:1vw;font-variant-numeric:tabular-nums}
.day:last-child{margin-right:0}
.day .n{font-size:.85vw;color:var(--fg-dim);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.day svg{width:2.2vw;height:2.2vw;margin:.3vw 0}
.day .hi{font-size:1.15vw;font-weight:600}
.day .lo{font-size:.9vw;color:var(--fg-dim)}
.status{font-size:.75vw;color:var(--fg-dim);margin-top:.5vw;letter-spacing:.04em;opacity:.8}
.debug{position:fixed;top:4vh;left:5vw;right:5vw;bottom:4vh;z-index:30;display:none;padding:1.5vw;border-radius:1.5vw;background:rgba(5,7,14,.92);border:1px solid var(--glass-edge);font-size:1vw;line-height:1.5;overflow:hidden;white-space:pre-wrap;font-family:monospace}
.debug.show{display:block}
.src{font-size:.62vw;color:var(--fg-dim);letter-spacing:.08em;text-transform:uppercase;margin-top:.4vw}

.bottom{position:absolute;left:5vw;right:5vw;bottom:5vh}
.rowwrap{overflow:visible;padding:3vw 0 1.2vw}
.apps{display:-webkit-flex;display:flex;white-space:nowrap;transition:transform .35s cubic-bezier(.2,.8,.2,1);will-change:transform}
.tile{position:relative;-webkit-flex:0 0 auto;flex:0 0 auto;width:16vw;height:10vw;margin-right:1.3vw;border-radius:1.4vw;overflow:hidden;
  background:var(--glass);border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 10px 24px rgba(0,0,0,.35);
  transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s,background .3s;transform-origin:50% 60%}
.tile:before{content:"";position:absolute;top:0;left:0;right:0;bottom:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:radial-gradient(ellipse 110% 70% at 25% 0%,rgba(255,255,255,.22),transparent 60%)}
.tile img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:none}
.tile.has-icon img{display:block}
.tile.has-icon.contain img{object-fit:contain;padding:14%}
.tile .glyph{position:absolute;left:50%;top:50%;width:3.8vw;height:3.8vw;margin:-2.1vw 0 0 -1.9vw;border-radius:26%;text-align:center;line-height:3.8vw;
  font-weight:700;font-size:2.2vw;color:#fff;background:linear-gradient(145deg,#6f7fa8,#2d3650);box-shadow:0 8px 20px rgba(0,0,0,.4)}
.tile.has-icon .glyph{display:none}
.tile .wm{position:absolute;left:8%;bottom:8%;font-size:.9vw;font-weight:600;color:var(--fg-dim);z-index:3;text-shadow:0 1px 6px rgba(0,0,0,.8)}
.tile.has-icon .wm{display:none}
.tile.is-focus{transform:translateY(-8%) scale(1.16);background:var(--glass-strong);z-index:5;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55),0 0 0 .22vw var(--focus),0 34px 60px rgba(0,0,0,.55)}
.tile.is-pressed{transform:translateY(-4%) scale(1.08)}
.label{height:2.6vw;padding-left:.6vw;font-size:2.1vw;font-weight:600;letter-spacing:-.01em;text-shadow:0 2px 20px rgba(0,0,0,.6);white-space:nowrap}
.label span{color:var(--fg-dim);font-weight:500;font-size:.62em;margin-left:.7em}

.toast{position:fixed;left:50%;top:16%;transform:translate(-50%,-10px);opacity:0;pointer-events:none;padding:.8vw 1.4vw;border-radius:1.2vw;
  background:var(--glass-strong);border:1px solid var(--glass-edge);font-weight:600;font-size:1.3vw;transition:opacity .25s,transform .25s;white-space:nowrap;z-index:20}
.toast.show{opacity:1;transform:translate(-50%,0)}
.credit{position:fixed;left:5vw;bottom:1vh;font-size:.68vw;color:var(--fg-dim);letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.hint{position:fixed;right:5vw;bottom:1vh;font-size:.68vw;color:var(--fg-dim);letter-spacing:.08em;text-transform:uppercase;opacity:.7}

.panel{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;display:none;background:rgba(5,7,14,.78)}
.panel.show{display:block}
.sheet{position:absolute;top:6vh;left:50%;width:70vw;margin-left:-35vw;bottom:6vh;border-radius:1.8vw;background:rgba(18,22,36,.96);border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 30px 80px rgba(0,0,0,.6);padding:2vw 2.4vw;overflow:hidden}
.sheet h2{margin:0 0 .4vw;font-size:2vw;font-weight:600;letter-spacing:-.02em}
.sheet p{margin:0 0 1.2vw;font-size:1vw;color:var(--fg-dim)}
.list{position:absolute;top:7.5vw;left:2.4vw;right:2.4vw;bottom:2vw;overflow:hidden}
.inner{transition:transform .25s}
.item{height:3.4vw;line-height:3.4vw;padding:0 1.2vw;border-radius:.9vw;font-size:1.25vw;font-weight:500;display:-webkit-flex;display:flex;-webkit-align-items:center;align-items:center;white-space:nowrap;overflow:hidden}
.item .ck{width:1.6vw;height:1.6vw;border-radius:.4vw;border:2px solid rgba(255,255,255,.5);margin-right:1vw;-webkit-flex:0 0 auto;flex:0 0 auto;text-align:center;line-height:1.5vw;font-size:1.1vw}
.item.on .ck{background:#fff;color:#0b0e17;border-color:#fff}
.item .nm{-webkit-flex:1 1 auto;flex:1 1 auto;overflow:hidden;text-overflow:ellipsis}
.item .id{color:var(--fg-dim);font-size:.8vw;margin-left:1vw;font-family:monospace}
.item.sel{background:var(--glass-strong);box-shadow:0 0 0 .18vw var(--focus)}
.item.hid{opacity:.55}
.menu .item{height:4vw;line-height:4vw;font-size:1.5vw}
</style>
</head>
<body>
<div class="stage">
  <div class="wall" id="wallA"></div><div class="wall" id="wallB"></div>
  <div class="vignette"></div>
</div>
<div class="ui">
  <div class="top">
    <div class="clock" id="clock">--:--</div>
    <div class="date" id="date"></div>
    <div class="status" id="status"></div>
    <div class="card weather" id="weather"><div class="row"><div class="now"><div class="d"><b>Meteo</b>caricamento…</div></div></div></div>
  </div>
  <div class="bottom">
    <div class="rowwrap"><div class="apps" id="apps"></div></div>
    <div class="label" id="label">Caricamento app…</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="debug" id="debug"></div>
<div class="panel" id="panel"><div class="sheet"><h2 id="ptitle"></h2><p id="pdesc"></p><div class="list"><div class="inner" id="plist"></div></div></div></div>
<div class="credit" id="credit"></div>
<div class="hint">↑ Menu · Indietro = TizenBrew · Home = Samsung</div>

<script>
(function(){
  var $=function(id){return document.getElementById(id)};
  var onTV=typeof tizen!=='undefined';
  var toastEl=$('toast'),tt;
  function toast(m,ms){toastEl.textContent=m;toastEl.classList.add('show');clearTimeout(tt);tt=setTimeout(function(){toastEl.classList.remove('show')},ms||1800);}

  /* ---------- orologio ---------- */
  var months=['gennaio','febbraio','marzo','aprile','maggio','giugno','luglio','agosto','settembre','ottobre','novembre','dicembre'];
  var days=['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'],dShort=['Dom','Lun','Mar','Mer','Gio','Ven','Sab'];
  function tick(){var d=new Date();$('clock').textContent=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
    $('date').textContent=days[d.getDay()]+' '+d.getDate()+' '+months[d.getMonth()];}
  tick();setInterval(tick,15000);

  /* ---------- sfondi ---------- */
  var WALLS=[['wall1.jpg','Duomo e Castello dall\'alto · Gianluca, Pexels'],['wall2.jpg','Castello Sforzesco · Mikhail Nilov, Pexels'],
             ['wall3.jpg','Guglie del Duomo all\'ora blu · A. Buchinskaia, Unsplash'],['wall4.jpg','Duomo al tramonto · Mahya Jahangir, Unsplash']];
  var A=$('wallA'),B=$('wallB'),front=A,wi=0;
  function showWall(i){var next=front===A?B:A;next.style.backgroundImage='url('+WALLS[i][0]+')';next.className='wall on '+(i%2?'kb2':'kb1');front.className='wall';front=next;$('credit').textContent='Foto: '+WALLS[i][1];}
  showWall(0);setInterval(function(){wi=(wi+1)%WALLS.length;showWall(wi);},60000);

  /* ---------- meteo: Open-Meteo, Berbenno di Valtellina ---------- */
  var ICONS={
    sun:'<svg viewBox="0 0 64 64" fill="none"><circle cx="32" cy="32" r="12" fill="#ffd36a"/><g stroke="#ffd36a" stroke-width="4" stroke-linecap="round"><path d="M32 6v8M32 50v8M6 32h8M50 32h8M13.6 13.6l5.7 5.7M44.7 44.7l5.7 5.7M13.6 50.4l5.7-5.7M44.7 19.3l5.7-5.7"/></g></svg>',
    partly:'<svg viewBox="0 0 64 64" fill="none"><circle cx="24" cy="24" r="10" fill="#ffd36a"/><path d="M20 50h26a9 9 0 0 0 1-18 13 13 0 0 0-25 3 7.5 7.5 0 0 0-2 15z" fill="#eef3ff"/></svg>',
    cloud:'<svg viewBox="0 0 64 64" fill="none"><path d="M18 50h28a10 10 0 0 0 1-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-2 17z" fill="#dfe6f5"/></svg>',
    fog:'<svg viewBox="0 0 64 64" fill="none"><g stroke="#dfe6f5" stroke-width="4" stroke-linecap="round"><path d="M12 24h40M8 34h48M14 44h36"/></g></svg>',
    rain:'<svg viewBox="0 0 64 64" fill="none"><path d="M18 42h28a10 10 0 0 0 1-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-2 17z" fill="#dfe6f5"/><g stroke="#7fb8ff" stroke-width="4" stroke-linecap="round"><path d="M24 48l-3 8M34 48l-3 8M44 48l-3 8"/></g></svg>',
    snow:'<svg viewBox="0 0 64 64" fill="none"><path d="M18 42h28a10 10 0 0 0 1-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-2 17z" fill="#dfe6f5"/><g fill="#fff"><circle cx="23" cy="52" r="3"/><circle cx="33" cy="56" r="3"/><circle cx="43" cy="52" r="3"/></g></svg>',
    storm:'<svg viewBox="0 0 64 64" fill="none"><path d="M18 40h28a10 10 0 0 0 1-20 14 14 0 0 0-27 3 8.5 8.5 0 0 0-2 17z" fill="#c9d3ea"/><path d="M34 40l-8 12h8l-4 10 12-14h-8l4-8z" fill="#ffd36a"/></svg>'
  };
  function wmo(c){if(c===0)return['sun','Sereno'];if(c<=2)return['partly','Poco nuvoloso'];if(c===3)return['cloud','Nuvoloso'];if(c<=48)return['fog','Nebbia'];
    if(c<=67)return['rain','Pioggia'];if(c<=77)return['snow','Neve'];if(c<=82)return['rain','Rovesci'];if(c<=86)return['snow','Neve'];return['storm','Temporale'];}
  function renderWeather(j){var cur=j.current,dl=j.daily,w=wmo(cur.weather_code),h='';
    h+='<div class="row"><div class="now">'+ICONS[w[0]]+'<div class="t">'+Math.round(cur.temperature_2m)+'<sup>°C</sup></div><div class="d"><b>Berbenno di Valtellina</b>'+w[1]+'<br>max '+Math.round(dl.temperature_2m_max[0])+'° · min '+Math.round(dl.temperature_2m_min[0])+'°</div></div><div class="days">';
    for(var i=1;i<=3&&i<dl.time.length;i++){var d=new Date(dl.time[i]+'T12:00:00'),ww=wmo(dl.weather_code[i]);
      h+='<div class="day"><div class="n">'+dShort[d.getDay()]+'</div>'+ICONS[ww[0]]+'<div class="hi">'+Math.round(dl.temperature_2m_max[i])+'°</div><div class="lo">'+Math.round(dl.temperature_2m_min[i])+'°</div></div>';}
    h+='</div></div><div class="src">Open-Meteo · aggiornato '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})+'</div>';
    $('weather').innerHTML=h;}
  function loadWeather(){var url='https://api.open-meteo.com/v1/forecast?latitude=46.165&longitude=9.745&daily=weather_code,temperature_2m_max,temperature_2m_min&current=temperature_2m,weather_code&timezone=Europe%2FRome&forecast_days=4';
    fetch(url).then(function(r){return r.json()}).then(function(j){renderWeather(j);try{localStorage.setItem('mh_wx',JSON.stringify(j))}catch(e){}})
    .catch(function(){try{var c=localStorage.getItem('mh_wx');if(c)renderWeather(JSON.parse(c));else $('weather').innerHTML='<div class="row"><div class="now"><div class="d"><b>Meteo</b>non disponibile</div></div></div>';}catch(e){}});}
  loadWeather();setInterval(loadWeather,3600000);

  /* ---------- app ---------- */
  var PREFERRED=['netflix','prime video','disney+','dazn','spotify','raiplay','mediaset infinity','now','sky go','apple tv','plex','paramount+','twitch','internet','samsung tv plus'];
  var HIDE=['smart hub','gallery','universal guide','e-manual','ambient','samsungtv','samsung health','bixby','multi view','camera','privacy','pc on tv','workspace','remote access','tv plus free','art mode','samsung promotion'];
  var SELF='samsung-tizen-home';
  var MODULE_LABEL={'tizentube':'YouTube <span>TizenTube · senza pubblicità</span>','jellyfin':'Jellyfin <span>film e serie dal PC</span>','moonlight':'Moonlight <span>giochi in streaming dal PC</span>'};
  var HDMI=[1,2,3,4].map(function(n){return {kind:'hdmi',id:'hdmi'+n,n:n,name:'HDMI '+n,label:'HDMI '+n+' <span>cambia sorgente</span>'}});
  var items=[],tiles=[],cur=0,ws=null,modules=[],allApps=[],catalog=[];
  var appsEl=$('apps'),label=$('label');
  var SVC='http://127.0.0.1:8095',svcOk=false,dbg={};

  /* preferenze: ordine e visibilità, salvate sulla TV */
  var prefs={order:[],hidden:[]};
  try{var pp=localStorage.getItem('mh_prefs');if(pp)prefs=JSON.parse(pp);}catch(e){}
  function savePrefs(){try{localStorage.setItem('mh_prefs',JSON.stringify(prefs))}catch(e){}}

  function fetchJson(u,ms){return new Promise(function(res,rej){var t=setTimeout(function(){rej(new Error('timeout'))},ms||3000);
    fetch(u).then(function(r){return r.json()}).then(function(j){clearTimeout(t);res(j)}).catch(function(e){clearTimeout(t);rej(e)});});}
  function waitService(tries){return fetchJson(SVC+'/ping',1500).then(function(j){svcOk=true;dbg.svc=j;return true;}).catch(function(){
    if(tries<=0)return false;return new Promise(function(r){setTimeout(function(){r(waitService(tries-1))},700)});});}
  function loadModules(){return new Promise(function(res){if(!onTV&&location.protocol==='file:')return res([]);
    try{ws=new WebSocket('ws://127.0.0.1:8081');var done=false;
      ws.onopen=function(){ws.send(JSON.stringify({type:4,payload:false}));};
      ws.onmessage=function(ev){try{var d=JSON.parse(ev.data);if(d.type===4&&!done){done=true;modules=d.payload||[];res(modules);}}catch(e){}};
      ws.onerror=function(){if(!done){done=true;res([]);}};setTimeout(function(){if(!done){done=true;res([]);}},4000);
    }catch(e){res([]);}});}
  function loadApps(){return waitService(8).then(function(ok){
    if(ok)return fetchJson(SVC+'/apps',6000).then(function(j){if(j.error){dbg.appsErr=j.error;return []}return j.apps||[]});
    return new Promise(function(res){if(!onTV||!tizen.application.getAppsInfo)return res([]);
      try{tizen.application.getAppsInfo(function(list){res(list||[])},function(e){dbg.appsErr=e&&e.message;res([])});}catch(e){dbg.appsErr=e.message;res([]);}});});}
  function iconUrl(a){if(!a.iconPath)return null;return svcOk?SVC+'/icon?path='+encodeURIComponent(a.iconPath):'file://'+a.iconPath;}
  function launchApp(id,name){if(svcOk){fetchJson(SVC+'/launch?id='+encodeURIComponent(id),8000).then(function(j){if(j.error)toast('Non riesco ad aprire '+name+': '+j.error,3000)}).catch(function(){toast('Servizio non raggiungibile')});return;}
    try{tizen.application.launch(id,function(){},function(e){toast('Non riesco ad aprire '+name+': '+(e&&e.message||''),3000)});}catch(e){toast('Errore: '+e.message,3000);}}
  function switchHdmi(n){if(!svcOk){toast('Servizio non disponibile');return;}toast('Passo a HDMI '+n+'…',4000);
    fetchJson(SVC+'/key?key=KEY_HDMI'+n,35000).then(function(j){if(j.error)toast('HDMI: '+j.error,5000)}).catch(function(){toast('HDMI: nessuna risposta',4000)});}

  function mkTile(it){var t=document.createElement('div');t.className='tile';
    var img=document.createElement('img');img.alt='';var gl=document.createElement('div');gl.className='glyph';gl.textContent=it.kind==='hdmi'?it.n:(it.name||'?').charAt(0).toUpperCase();
    var wm=document.createElement('div');wm.className='wm';wm.textContent=it.name;t.appendChild(img);t.appendChild(gl);t.appendChild(wm);
    if(it.icon){img.onload=function(){t.classList.add('has-icon');if(img.naturalWidth<=img.naturalHeight*1.05)t.classList.add('contain');};img.onerror=function(){t.classList.remove('has-icon')};img.src=it.icon;}
    t.addEventListener('click',function(){focus(tiles.indexOf(t));launch();});return t;}
  function render(){appsEl.innerHTML='';tiles=[];items.forEach(function(it){var t=mkTile(it);appsEl.appendChild(t);tiles.push(t);});if(cur>=tiles.length)cur=0;focus(cur);}
  function focus(i){if(!tiles.length)return;cur=(i+tiles.length)%tiles.length;tiles.forEach(function(t,k){t.classList.toggle('is-focus',k===cur)});
    label.innerHTML=items[cur].label||items[cur].name;
    var vw=appsEl.parentNode.clientWidth,t=tiles[cur],x=t.offsetLeft,w=t.offsetWidth,total=appsEl.scrollWidth,shift=0;
    if(total>vw)shift=Math.min(Math.max(0,x+w/2-vw/2),total-vw);appsEl.style.transform='translateX('+(-shift)+'px)';}
  function launch(){var it=items[cur],t=tiles[cur];if(!it)return;t.classList.add('is-pressed');setTimeout(function(){t.classList.remove('is-pressed')},180);
    if(!onTV&&!svcOk){toast('Apro '+it.name+' (anteprima)');return;}
    try{if(it.kind==='app')launchApp(it.id,it.name);else if(it.kind==='module')launchModule(it.mod);else if(it.kind==='hdmi')switchHdmi(it.n);
      else if(it.kind==='home'){tizen.application.getCurrentApplication().exit();}}catch(e){toast('Errore: '+e.message);}}
  function launchModule(m){if(!ws||ws.readyState!==1){toast('Servizio TizenBrew non raggiungibile');return;}
    try{(m.keys||[]).forEach(function(k){try{tizen.tvinputdevice.registerKey(k)}catch(e){}});}catch(e){}
    ws.send(JSON.stringify({type:5,payload:m}));setTimeout(function(){location.href=m.appPath;},150);}

  /* catalogo completo -> applica preferenze -> elenco visibile */
  function buildCatalog(mods,apps){var cat=[];
    mods.forEach(function(m){if(!m||!m.appName||(m.name||'').toLowerCase().indexOf(SELF)>=0)return;var key=(m.name||'').toLowerCase().replace(/^@[^/]+\//,'');
      var lab=null;Object.keys(MODULE_LABEL).forEach(function(k){if(key.indexOf(k)>=0)lab=MODULE_LABEL[k];});
      cat.push({kind:'module',id:'mod:'+m.fullName,mod:m,name:m.appName,label:lab,icon:null,def:true,rank:key.indexOf('tizentube')>=0?0:50});});
    apps.forEach(function(a){if(!a||!a.name||!a.id)return;var n=a.name.toLowerCase();var r=PREFERRED.findIndex(function(p){return n===p||n.indexOf(p)===0});
      var generic=/^(app|apps|service|widget|)$/i.test(a.name.trim())||a.id.indexOf('org.tizen')===0||n.indexOf('samsung')>=0&&r<0;
      var store=/^\d{8,}/.test(a.id)||/^[A-Za-z0-9]{10}\./.test(a.id);
      var hid=r<0||a.show===false||HIDE.some(function(h){return n.indexOf(h)>=0});
      cat.push({kind:'app',id:a.id,name:a.name,icon:iconUrl(a),def:!hid,rank:r>=0?10+r:(store?100:900),sys:generic||!store});});
    HDMI.forEach(function(h,i){cat.push({kind:'hdmi',id:h.id,n:h.n,name:h.name,label:h.label,def:i<2,rank:60+i});});
    cat.push({kind:'home',id:'home',name:'Home Samsung',label:'Home Samsung <span>esci dal launcher</span>',def:true,rank:999});
    return cat;}
  function applyPrefs(){var byId={};catalog.forEach(function(c){byId[c.id]=c});var out=[];
    prefs.order.forEach(function(id){if(byId[id]){out.push(byId[id]);delete byId[id];}});
    Object.keys(byId).map(function(k){return byId[k]}).sort(function(a,b){return a.rank-b.rank||a.name.localeCompare(b.name)}).forEach(function(c){out.push(c)});
    items=out.filter(function(c){var h=prefs.hidden.indexOf(c.id)>=0;var inOrder=prefs.order.indexOf(c.id)>=0;return inOrder?!h:(c.def&&!h);});
    if(!items.length)items=out.filter(function(c){return c.def});
    return out;}

  Promise.all([loadModules(),loadApps()]).then(function(r){
    var mods=r[0],apps=r[1];allApps=apps;catalog=buildCatalog(mods,apps);
    var demo=(!onTV&&!svcOk&&apps.length===0&&mods.length===0);
    if(demo){catalog=[{name:'YouTube',label:'YouTube <span>TizenTube</span>'},{name:'Netflix'},{name:'Prime Video'},{name:'Disney+'},{name:'DAZN'},{name:'Jellyfin'},{name:'Moonlight'},{name:'HDMI 1',kind:'hdmi',n:1},{name:'Home Samsung'}].map(function(c,i){c.kind=c.kind||'app';c.id='demo'+i;c.def=true;c.rank=i;return c;});}
    applyPrefs();render();
    $('status').textContent=(demo?'anteprima · ':'')+'servizio '+(svcOk?'ok':'assente')+' · app '+apps.length+' · moduli '+mods.length+(dbg.appsErr?' · errore: '+dbg.appsErr:'');
  });

  /* ---------- menu (freccia su) ---------- */
  var panel=$('panel'),plist=$('plist'),mode=null,psel=0,prows=[];
  function openMenu(){mode='menu';psel=0;$('ptitle').textContent='Milano Home';$('pdesc').textContent='Invio per scegliere · Indietro per chiudere';
    prows=[{t:'Scegli e ordina le app',a:openPicker},{t:'Mostra tutte le app di sistema',a:function(){openPicker(true)}},{t:'Ripristina ordine predefinito',a:function(){prefs={order:[],hidden:[]};savePrefs();applyPrefs();render();closePanel();toast('Ordine ripristinato');}},{t:'Diagnostica',a:function(){closePanel();toggleDebug();}}];
    plist.className='inner menu';drawRows();panel.classList.add('show');}
  var pickAll=false,pick=[];
  function openPicker(all){mode='pick';pickAll=!!all;psel=0;$('ptitle').textContent='Scegli e ordina le app';$('pdesc').textContent='Invio = mostra/nascondi · ← → = sposta · Indietro = salva e chiudi';
    pick=applyPrefs().filter(function(c){return pickAll||!c.sys||prefs.order.indexOf(c.id)>=0;});
    plist.className='inner';drawRows();panel.classList.add('show');}
  function isVisible(c){var h=prefs.hidden.indexOf(c.id)>=0;var inOrder=prefs.order.indexOf(c.id)>=0;return inOrder?!h:(c.def&&!h);}
  function drawRows(){plist.innerHTML='';var rows=mode==='menu'?prows:pick;
    rows.forEach(function(r,i){var d=document.createElement('div');d.className='item'+(i===psel?' sel':'');
      if(mode==='menu'){d.textContent=r.t;}else{var on=isVisible(r);d.className+=(on?' on':' hid');d.innerHTML='<span class="ck">'+(on?'✓':'')+'</span><span class="nm"></span><span class="id"></span>';d.querySelector('.nm').textContent=r.name+(r.sys?' (sistema)':'');d.querySelector('.id').textContent=(pickAll&&r.kind==='app')?r.id:'';}
      plist.appendChild(d);});
    var rowH=mode==='menu'?4:3.4,vwpx=window.innerWidth/100,listH=plist.parentNode.clientHeight,shift=Math.max(0,(psel+1)*rowH*vwpx-listH+rowH*vwpx);plist.style.transform='translateY(-'+shift+'px)';}
  function commitOrder(){prefs.order=pick.map(function(c){return c.id});prefs.hidden=pick.filter(function(c){return !isVisibleRaw(c)}).map(function(c){return c.id});savePrefs();applyPrefs();render();}
  var vis={};function isVisibleRaw(c){return vis[c.id]!==undefined?vis[c.id]:isVisible(c);}
  function closePanel(){if(mode==='pick'){commitOrder();}panel.classList.remove('show');mode=null;vis={};}
  function panelKey(k){var rows=mode==='menu'?prows:pick;
    if(k===40){psel=(psel+1)%rows.length;drawRows();}else if(k===38){psel=(psel-1+rows.length)%rows.length;drawRows();}
    else if(k===13){if(mode==='menu')rows[psel].a();else{var c=pick[psel];vis[c.id]=!isVisibleRaw(c);prefs.hidden=prefs.hidden.filter(function(x){return x!==c.id});if(!vis[c.id])prefs.hidden.push(c.id);if(prefs.order.indexOf(c.id)<0)prefs.order=pick.map(function(x){return x.id});drawRows();}}
    else if((k===37||k===39)&&mode==='pick'){var j=k===37?psel-1:psel+1;if(j<0||j>=pick.length)return;var tmp=pick[psel];pick[psel]=pick[j];pick[j]=tmp;psel=j;drawRows();}
    else if(k===10009||k===27||k===8){closePanel();}}
  function toggleDebug(){var d=$('debug');if(d.classList.contains('show')){d.classList.remove('show');return;}
    var lines=['MILANO HOME · diagnostica  (Indietro per chiudere)','servizio: '+JSON.stringify(dbg.svc||null)+'  tizen: '+onTV+'  moduli: '+modules.map(function(m){return m.name}).join(', ')];
    allApps.forEach(function(a){lines.push((a.show===false?'[nascosta] ':'')+a.name+'  ·  '+a.id);});
    d.textContent=lines.join('\n');d.classList.add('show');}

  /* ---------- telecomando ---------- */
  document.addEventListener('keydown',function(e){var k=e.keyCode;
    if($('debug').classList.contains('show')){if(k===10009||k===27||k===8||k===13){$('debug').classList.remove('show');e.preventDefault();}return;}
    if(mode){panelKey(k);e.preventDefault();return;}
    if(k===39){focus(cur+1);e.preventDefault();}else if(k===37){focus(cur-1);e.preventDefault();}
    else if(k===13){launch();e.preventDefault();}
    else if(k===38){openMenu();e.preventDefault();}
    else if(k===10009||k===27){e.preventDefault();if(history.length>1)history.back();else if(onTV)tizen.application.getCurrentApplication().exit();}
  });
  window.addEventListener('resize',function(){focus(cur)});
  document.addEventListener('visibilitychange',function(){if(!document.hidden){tick();loadWeather();}});
})();
</script>
</body>

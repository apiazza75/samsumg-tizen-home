<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, initial-scale=1">
<title>Milano Home</title>
<style>html,body{width:100%;height:100%;margin:0;background:#05070e;color:#f4f6fb;font-family:"Samsung One",sans-serif;overflow:hidden;cursor:none}
.boot{position:fixed;left:5vw;bottom:5vh;font-size:1.1vw;color:rgba(244,246,251,.55);letter-spacing:.08em;text-transform:uppercase}</style>
</head>
<body>
<div class="boot" id="boot">Milano Home · avvio…</div>
<script>
/* Bootstrap di Milano Home. Questo file e service.js sono volutamente stabili: TizenBrew li legge da jsDelivr, che li tiene in
   cache fino a 7 giorni. Il launcher vero (launcher.html) viene caricato qui a ogni avvio dall'ultimo commit di main, con un URL
   che contiene lo SHA del commit: su jsDelivr è immutabile, quindi non c'è mai cache vecchia e il modulo non va più reinstallato.
   Se GitHub non risponde si usa l'ultimo commit noto (localStorage) e, in mancanza, il ramo main. ES5 per Chromium 76 (Tizen 6). */
(function () {
  var REPO = 'apiazza75/samsung-tizen-home';
  var CDN = window.MH_CDN || 'https://cdn.jsdelivr.net/gh/' + REPO + '@';
  var API = window.MH_API || 'https://api.github.com/repos/' + REPO + '/commits/main';
  var boot = document.getElementById('boot'), done = false;
  function note(t) { try { boot.textContent = t; } catch (e) {} }
  function fail(msg) { note('Milano Home · ' + msg + ' · premi Invio per riprovare'); document.addEventListener('keydown', function (e) { if (e.keyCode === 13) location.reload(); }); }
  function withTimeout(p, ms) { return new Promise(function (res, rej) { var t = setTimeout(function () { rej(new Error('timeout')); }, ms); p.then(function (v) { clearTimeout(t); res(v); }, function (e) { clearTimeout(t); rej(e); }); }); }
  function load(ref, isFallback) {
    var base = CDN + ref + '/app/';
    note('Milano Home · carico ' + (ref.length === 40 ? ref.slice(0, 7) : ref) + '…');
    return withTimeout(fetch(base + 'launcher.html', { cache: 'no-store' }), 10000)
      .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
      .then(function (html) {
        if (done) return; done = true;
        try { localStorage.setItem('mh_ref', ref); } catch (e) {}
        window.MH_REF = ref;
        // <base> fa risolvere font, sfondi e immagini relative dentro la cartella del commit; l'origine resta 127.0.0.1:8081
        html = html.replace(/<head>/i, '<head><base href="' + base + '">');
        document.open(); document.write(html); document.close();
      })
      .catch(function (e) {
        if (!isFallback && ref !== 'main') return load('main', true);
        fail('launcher non scaricabile (' + (e && e.message ? e.message : e) + ')');
      });
  }
  var m = /[?&]ref=([\w.-]+)/.exec(location.search);
  if (m) return load(m[1], true);
  var last = null; try { last = localStorage.getItem('mh_ref'); } catch (e) {}
  withTimeout(fetch(API, { headers: { Accept: 'application/vnd.github.sha' }, cache: 'no-store' }), 5000)
    .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.text(); })
    .then(function (sha) { sha = sha.trim(); if (!/^[0-9a-f]{40}$/.test(sha)) throw new Error('sha?'); return load(sha); })
    .catch(function () { return load(last || 'main', !last); });
})();
</script>
</body>
</html>
